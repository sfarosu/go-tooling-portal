version: 2

project_name: go-tooling-portal

dist: ./dist

env:
  - GO111MODULE=on

before:
  hooks:
    - go mod tidy

builds:
  - id: release-build
    binary: go-tooling-portal
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X 'github.com/sfarosu/{{ .ProjectName }}/internal/version.BuildDate={{ .Date }}'
      - -X 'github.com/sfarosu/{{ .ProjectName }}/internal/version.GitShortHash={{ .ShortCommit }}'

archives:
  - id: release-archive
    ids:
      - release-build
    formats: [ 'tar.gz' ]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "SNAPSHOT-{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  ids:
    - release-archive
  github:
    owner: sfarosu
    name: go-tooling-portal

dockers_v2:
  - id: multi-arch
    dockerfile: Dockerfile-Goreleaser
    ids:
      - release-build
    images:
      - "docker.io/sfarosu/{{ .ProjectName }}"
    tags:
      - latest
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - --pull
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    extra_files:
      - scripts

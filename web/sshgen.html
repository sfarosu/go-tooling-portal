<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SSH Key Generator - Go Tooling Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SSH key pair generator">
    <!-- Bootstrap CSS, Icons and Javascript -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
    <!-- Custom styling -->
    <link rel="stylesheet" href="assets/styles.css">
    <!-- Custom scripts -->
    <script src="assets/scripts.js"></script>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
    <!-- Load the shared navbar from navbar.html using htmx (avoids code duplication across pages) -->
    <div hx-get="navbar.html" hx-trigger="load"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="my-5 ">
                <h3 class="text-center fw-bold mb-5" data-bs-toggle="tooltip" data-bs-placement="bottom"
                    title="Generate SSH key pairs for various algorithms.">
                    SSH Key Generator
                </h3>
                <div class="row g-4 mb-4">
                    <div class="col-12">
                        <form class="row g-3" id="sshgen-form"
                            hx-post="/api/sshgen/htmx"
                            hx-target="#sshgen-result"
                            hx-swap="innerHTML"
                            hx-ext="json-enc">
                            <div class="col-md-4">
                                <label for="algorithm" class="form-label text-center w-100">Algorithm</label>
                                <select class="form-select custom-input" id="algorithm" name="algorithm" required onchange="toggleForms('algorithm', ['ecdsa', 'rsa'], ['ecdsa-bitsize', 'rsa-bitsize'])">>
                                    <option value="ed25519" selected>ed25519 (best)</option>
                                    <option value="ecdsa">ecdsa (balanced)</option>
                                    <option value="rsa">rsa (most compatible)</option>
                                </select>
                            </div>
                            <!-- Bitsize selectors, shown/hidden based on algorithm choice -->
                            <div class="col-md-4 d-none" id="ecdsa-bitsize">
                                <label for="ecdsa-bitsize" class="form-label text-center w-100">ECDSA key bitsize</label>
                                <select class="form-select custom-input" id="ecdsaBits" name="ecdsaBits">
                                    <option value="521">521</option>
                                    <option value="384">384</option>
                                    <option value="256">256</option>
                                </select>
                            </div>
                            <div class="col-md-4 d-none" id="rsa-bitsize">
                                <label for="rsa-bitsize" class="form-label text-center w-100">RSA key bitsize</label>
                                <select class="form-select custom-input" id="rsaBits" name="rsaBits">
                                    <option value="4096">4096</option>
                                    <option value="3072">3072</option>
                                    <option value="1024">1024</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="email" class="form-label text-center w-100">Email/Comment</label>
                                <input type="email" class="form-control custom-input" id="email" name="email" placeholder="alice@example.com" required>
                            </div>
                            <div class="col-12 mt-5 mb-3 text-center">
                                <button type="submit" class="btn btn-graphite px-3">Generate</button>
                            </div>
                        </form>
                        <div id="sshgen-result" class="mt-4"></div>
                        <!-- CLI command alternatives -->
                        <hr class="my-5">
                        <h5 class="text-center fw-bold mb-5">CLI command alternatives for Linux</h5>
                        <div class="row g-4">
                            <div class="col-md-4">
                                <label class="form-label text-center w-100">ED25519</label>
                                <div class="d-flex flex-nowrap align-items-stretch">
                                    <pre class="flex-grow-1 mb-0 p-3 bg-dark rounded"
                                        id="cli-ed25519">ssh-keygen -t ed25519 -C "your-email@example.com"</pre>
                                    <button class="btn btn-graphite" type="button" onclick="copyToClipboard('cli-ed25519')"
                                        title="Copy CLI command" aria-label="Copy CLI command">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-center w-100">ECDSA</label>
                                <div class="d-flex flex-nowrap align-items-stretch">
                                    <pre class="flex-grow-1 mb-0 p-3 bg-dark rounded"
                                        id="cli-ecdsa">ssh-keygen -t ecdsa -b 384 -C "your-email@example.com"</pre>
                                    <button class="btn btn-graphite" type="button" onclick="copyToClipboard('cli-ecdsa')"
                                        title="Copy CLI command" aria-label="Copy CLI command">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-center w-100">RSA</label>
                                <div class="d-flex flex-nowrap align-items-stretch">
                                    <pre class="flex-grow-1 mb-0 p-3 bg-dark rounded"
                                        id="cli-rsa">ssh-keygen -t rsa -b 2048 -C "your-email@example.com"</pre>
                                    <button class="btn btn-graphite" type="button" onclick="copyToClipboard('cli-rsa')"
                                        title="Copy CLI command" aria-label="Copy CLI command">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Load the shared footer from footer.html using htmx (avoids code duplication across pages) -->
    <div hx-get="footer.html" hx-trigger="load"></div>

</body>

</html>

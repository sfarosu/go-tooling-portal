<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>URL Decoder - Go Tooling Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Decode URL components and query parameters">
    <!-- Bootstrap CSS, Icons and Javascript -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/json-enc.js"></script>
    <!-- Custom styling -->
    <link rel="stylesheet" href="assets/styles.css">
    <!-- Custom scripts -->
    <script src="assets/scripts.js"></script>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
    <!-- Load the shared navbar from navbar.html using htmx (avoids code duplication across pages) -->
    <div hx-get="navbar.html" hx-trigger="load"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="mt-3 mb-5">
                <h3 class="text-center fw-bold mb-5" data-bs-toggle="tooltip" data-bs-placement="bottom"
                    title="Parse a URL and decode its path and query parameters">
                    URL Decoder
                </h3>
                <form id="urldecoder-form"
                    hx-post="/api/urldecoder/htmx"
                    hx-target="#urldecoder-result"
                    hx-swap="innerHTML"
                    hx-ext="json-enc">
                    <div class="mb-3">
                        <label for="url" class="form-label">URL to decode</label>
                        <textarea class="form-control custom-input placeholder-dim" id="url" name="url" rows="5"
                            placeholder="https://example.com/foo+bar%21?service=ab%2Bc&amp;product=de%24f&amp;service=second"
                            required></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-graphite px-3">Decode</button>
                    </div>
                </form>
                <div id="urldecoder-result" class="mt-4"></div>
            </div>
        </div>
    </main>

    <!-- Load the shared footer from footer.html using htmx (avoids code duplication across pages) -->
    <div hx-get="footer.html" hx-trigger="load"></div>
</body>

</html>

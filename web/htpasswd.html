<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Htpasswd Generator - Go Tooling Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Htpasswd generator">
    <!-- Bootstrap CSS, Icons and Javascript -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
    <!-- Custom styling -->
    <link rel="stylesheet" href="assets/styles.css">
    <!-- Custom scripts -->
    <script src="assets/scripts.js"></script>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
    <!-- Load the shared navbar from navbar.html using htmx (avoids code duplication across pages) -->
    <div hx-get="navbar.html" hx-trigger="load"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="my-5 ">
                <h3 class="text-white text-center fw-bold mb-4">Htpasswd Generator</h3>
                <div class="row g-4 mb-4">
                    <div class="col-12">
                        <form class="row g-3" id="htpasswd-form" hx-post="/api/htpasswd/htmx"
                            hx-target="#htpasswd-result" hx-swap="innerHTML" hx-ext="json-enc">
                            <div class="col-md-4">
                                <label for="username" class="form-label text-white text-center w-100">Username</label>
                                <input type="text" class="form-control custom-input" id="username" name="username"
                                    required minlength="1" autocomplete="username">
                            </div>
                            <div class="col-md-4">
                                <label for="password" class="form-label text-white text-center w-100">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control custom-input" id="password"
                                        name="password" required minlength="1" autocomplete="new-password">
                                    <button class="btn btn-graphite" type="button"
                                        onclick="togglePasswordVisibility('password', 'togglePasswordIcon')"
                                        id="togglePassword" tabindex="-1">
                                        <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label for="algorithm" class="form-label text-white text-center w-100">Algorithm</label>
                                <select class="form-select custom-input" id="algorithm" name="algorithm" required>
                                    <option value="apr1" selected>MD5-based algorithm, Apache variant</option>
                                    <option value="1">MD5-based algorithm</option>
                                    <option value="5">SHA256-based algorithm</option>
                                    <option value="6">SHA512-based algorithm</option>
                                </select>
                            </div>
                            <div class="col-12 mt-5 mb-3 text-center">
                                <button type="submit" class="btn btn-graphite px-3">Generate</button>
                            </div>
                        </form>
                        <div id="htpasswd-result" class="mt-4"></div>

                        <!-- CLI command alternatives -->
                        <hr class="my-5">
                        <h5 class="text-white text-center fw-bold mb-4">CLI command alternatives</h5>
                        <div class="row g-4">
                            <!-- MD5 (Apache variant) -->
                            <div class="col-md-6">
                                <label class="form-label text-center w-100">MD5 (Apache variant)</label>
                                <div class="input-group">
                                    <pre class="flex-grow-1 mb-0 p-3 bg-dark text-white rounded"
                                        id="cli-apr1">echo "your-username:$(openssl passwd -apr1 your-password)"</pre>
                                    <button class="btn btn-graphite" type="button" onclick="copyToClipboard('cli-apr1')"
                                        title="Copy CLI command" aria-label="Copy CLI command">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- MD5 (standard) -->
                            <div class="col-md-6">
                                <label class="form-label text-center w-100">MD5 (standard)</label>
                                <div class="input-group">
                                    <pre class="flex-grow-1 mb-0 p-3 bg-dark text-white rounded"
                                        id="cli-md5">echo "your-username:$(openssl passwd -1 your-password)"</pre>
                                    <button class="btn btn-graphite" type="button" onclick="copyToClipboard('cli-md5')"
                                        title="Copy CLI command" aria-label="Copy CLI command">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>
                            <!-- SHA-256 -->
                            <div class="col-md-6">
                                <label class="form-label text-center w-100">SHA-256</label>
                                <div class="input-group">
                                    <pre class="flex-grow-1 mb-0 p-3 bg-dark text-white rounded"
                                        id="cli-sha256">echo "your-username:$(openssl passwd -5 your-password)"</pre>
                                    <button class="btn btn-graphite" type="button"
                                        onclick="copyToClipboard('cli-sha256')" title="Copy CLI command"
                                        aria-label="Copy CLI command">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>
                            <!-- SHA-512 -->
                            <div class="col-md-6">
                                <label class="form-label text-center w-100">SHA-512</label>
                                <div class="input-group">
                                    <pre class="flex-grow-1 mb-0 p-3 bg-dark text-white rounded"
                                        id="cli-sha512">echo "your-username:$(openssl passwd -6 your-password)"</pre>
                                    <button class="btn btn-graphite" type="button"
                                        onclick="copyToClipboard('cli-sha512')" title="Copy CLI command"
                                        aria-label="Copy CLI command">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Load the shared footer from footer.html using htmx (avoids code duplication across pages) -->
    <div hx-get="footer.html" hx-trigger="load"></div>

</body>

</html>

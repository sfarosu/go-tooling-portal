<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Htpasswd Generator - Go Tooling Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Htpassword generator.">
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
    <!-- Custom styling -->
    <link rel="stylesheet" href="assets/styles.css">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
    <!-- Load the shared navbar from navbar.html using htmx (avoids code duplication across pages) -->
    <div hx-get="navbar.html" hx-trigger="load"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="section-box my-5">
                <h3 class="text-white mb-4">Htpasswd Generator</h3>
                <div class="row g-4 mb-4">
                    <div class="col-12">
                        <form id="htpasswd-form" class="row g-3" hx-post="/api/htpasswd/htmx" hx-target="#htpasswd-result" hx-swap="innerHTML" hx-ext="json-enc">
                            <div class="col-md-4">
                                <label for="username" class="form-label text-white">Username</label>
                                <input type="text" class="form-control custom-input" id="username" name="username" required minlength="1" autocomplete="username">
                            </div>
                                <div class="col-md-4">
                                    <label for="password" class="form-label text-white">Password</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control custom-input" id="password" name="password" required minlength="1" autocomplete="new-password">
                                        <button class="btn btn-graphite" type="button" id="togglePassword" tabindex="-1">
                                            <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                                        </button>
                                    </div>
                                </div>
                            <div class="col-md-4">
                                <label for="algorithm" class="form-label text-white">Algorithm</label>
                                <select class="form-select custom-input" id="algorithm" name="algorithm" required>
                                    <option value="apr1" selected>apr1 (Apache MD5)</option>
                                    <option value="1">1 (MD5)</option>
                                    <option value="5">5 (SHA-256)</option>
                                    <option value="6">6 (SHA-512)</option>
                                </select>
                            </div>
                            <div class="col-12 mt-3">
                                <button type="submit" class="btn btn-graphite px-4">Generate</button>
                            </div>
                        </form>
                        <div id="htpasswd-result" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

<script>
    // Show/hide password logic
    document.addEventListener('DOMContentLoaded', function () {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');
        const toggleIcon = document.getElementById('togglePasswordIcon');

        toggleBtn.addEventListener('click', function () {
            const isVisible = passwordInput.type === 'text';
            passwordInput.type = isVisible ? 'password' : 'text';
            toggleIcon.className = isVisible ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    });
</script>

</body>
</html>

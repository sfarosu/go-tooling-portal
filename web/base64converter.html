<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Base64 Converter - Go Tooling Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="base64 converter">
    <!-- Bootstrap CSS, Icons and Javascript -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
    <!-- Custom styling -->
    <link rel="stylesheet" href="assets/styles.css">
    <!-- Custom scripts -->
    <script src="assets/scripts.js"></script>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
    <!-- Load the shared navbar from navbar.html using htmx (avoids code duplication across pages) -->
    <div hx-get="navbar.html" hx-trigger="load"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="my-5 ">
                <h3 class="text-center fw-bold mb-5" data-bs-toggle="tooltip" data-bs-placement="bottom"
                    title="Easily encode or decode strings using Base64 (standard or URL-compatible) for data processing.">
                    Base64 Converter
                </h3>
                <div class="row g-4 mb-4">
                    <div class="col-12">
                        <form class="row g-3" id="base64converter-form" hx-post="/api/base64converter/htmx"
                            hx-target="#base64converter-result" hx-swap="innerHTML" hx-ext="json-enc">
                            <!-- Input -->
                            <div class="col-md-10 ">
                                <label for="input" class="form-label">Input</label>
                                <textarea class="form-control custom-input" id="input" name="input" rows="5"
                                    required></textarea>
                            </div>
                            <!-- Right-side selectors -->
                            <div class="col-md-2">
                                <div class="row g-3">
                                    <div class="col-9 text-center">
                                        <label for="operation" class="form-label">Operation</label>
                                        <select class="form-select custom-input" id="operation" name="operation"
                                            required>
                                            <option value="encode" selected>encode</option>
                                            <option value="decode">decode</option>
                                        </select>
                                    </div>
                                    <div class="col-9 mt-4 text-center">
                                        <label for="format" class="form-label">Format</label>
                                        <select class="form-select custom-input" id="format" name="format" required>
                                            <option value="standard" selected>standard</option>
                                            <option value="url-compatible">url-compatible</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <!-- Submit button -->
                            <div class="col-12 mt-5 mb-3 text-center">
                                <button type="submit" class="btn btn-graphite px-3">Convert</button>
                            </div>
                        </form>
                        <div id="base64converter-result" class="mt-4"></div>
                        <!-- CLI command alternatives -->
                        <hr class="my-5">
                        <h5 class="text-center fw-bold mb-5">CLI command alternatives for Linux</h5>
                        <div class="row g-4">
                            <!-- Encode Standard -->
                            <div class="col-md-6">
                                <label class="form-label text-center w-100">Encode Standard</label>
                                <div class="d-flex flex-nowrap align-items-stretch">
                                    <pre class="flex-grow-1 mb-0 p-3 bg-dark rounded"
                                        id="cli-encode-standard">echo -n "your-text" | base64</pre>
                                    <button class="btn btn-graphite" type="button"
                                        onclick="copyToClipboard('cli-encode-standard')" title="Copy CLI command"
                                        aria-label="Copy CLI command">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>
                            <!-- Decode Standard -->
                            <div class="col-md-6">
                                <label class="form-label text-center w-100">Decode Standard</label>
                                <div class="d-flex flex-nowrap align-items-stretch">
                                    <pre class="flex-grow-1 mb-0 p-3 bg-dark rounded"
                                        id="cli-decode-standard">echo "eW91ci10ZXh0" | base64 --decode</pre>
                                    <button class="btn btn-graphite" type="button"
                                        onclick="copyToClipboard('cli-decode-standard')" title="Copy CLI command"
                                        aria-label="Copy CLI command">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>
                            <!-- Encode URL-compatible -->
                            <div class="col-md-6">
                                <label class="form-label text-center w-100">Encode URL-compatible</label>
                                <div class="d-flex flex-nowrap align-items-stretch">
                                    <pre class="flex-grow-1 mb-0 p-3 bg-dark rounded"
                                        id="cli-encode-url-compatible">echo -n "https://mock.io/search?q=a+b" | base64 | tr '+/' '-_'</pre>
                                    <button class="btn btn-graphite" type="button"
                                        onclick="copyToClipboard('cli-encode-url-compatible')" title="Copy CLI command"
                                        aria-label="Copy CLI command">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>
                            <!-- Decode URL-compatible -->
                            <div class="col-md-6">
                                <label class="form-label text-center w-100">Decode URL-compatible</label>
                                <div class="d-flex flex-nowrap align-items-stretch">
                                    <pre class="flex-grow-1 mb-0 p-3 bg-dark rounded"
                                        id="cli-decode-url-compatible">echo 'aHR0cHM6Ly9tb2NrLmlvL3NlYXJjaD9xPWErYg==' | tr '_-' '/+' | base64 --decode</pre>
                                    <button class="btn btn-graphite" type="button"
                                        onclick="copyToClipboard('cli-decode-url-compatible')" title="Copy CLI command"
                                        aria-label="Copy CLI command">
                                        <i class="bi bi-clipboard"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Load the shared footer from footer.html using htmx (avoids code duplication across pages) -->
    <div hx-get="footer.html" hx-trigger="load"></div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Password Generator - Go Tooling Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Password generator">
  <!-- Bootstrap CSS, Icons and Javascript -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
  <!-- Custom styling -->
  <link rel="stylesheet" href="assets/styles.css">
  <!-- Custom scripts -->
  <script src="assets/scripts.js"></script>
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
  <!-- Load the shared navbar from navbar.html using htmx (avoids code duplication across pages) -->
  <div hx-get="navbar.html" hx-trigger="load"></div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <div class="my-5 ">
        <h3 class="text-center fw-bold mb-5" data-bs-toggle="tooltip" data-bs-placement="bottom"
          title="Generate random passwords with selectable character classes.">
          Password Generator
        </h3>
        <div class="row g-4 mb-4">
          <div class="col-12">
            <form class="row g-3 justify-content-center" id="passgen-form"
              hx-post="/api/passgen/htmx"
              hx-target="#passgen-result"
              hx-swap="innerHTML"
              hx-ext="json-enc">
              <!-- Length -->
              <div class="col-md-2">
                <label for="length" class="form-label text-center w-100">Length</label>
                <input type="number" class="form-control custom-input" id="length" name="length"
                  value="16" min="1" required>
              </div>
              <!-- Uppercase -->
              <div class="col-md-1">
                <label for="uppercase" class="form-label text-center w-100">Uppercase</label>
                <select class="form-select custom-input" id="uppercase" name="uppercase" class="form-select">
                  <option value="true" selected>Yes</option>
                  <option value="false">No</option>
                </select>
              </div>
              <!-- Lowercase -->
              <div class="col-md-1">
                <label for="lowercase" class="form-label text-center w-100">Lowercase</label>
                <select class="form-select custom-input" id="lowercase" name="lowercase" class="form-select">
                  <option value="true" selected>Yes</option>
                  <option value="false">No</option>
                </select>
              </div>
              <!-- Numbers -->
              <div class="col-md-1">
                <label for="numbers" class="form-label text-center w-100">Numbers</label>
                <select class="form-select custom-input" id="numbers" name="numbers" class="form-select">
                  <option value="true" selected>Yes</option>
                  <option value="false">No</option>
                </select>
              </div>
              <!-- Symbols -->
              <div class="col-md-1">
                <label for="symbols" class="form-label text-center w-100">Symbols</label>
                <select class="form-select custom-input" id="symbols" name="symbols" class="form-select">
                  <option value="true" selected>Yes</option>
                  <option value="false">No</option>
                </select>
              </div>
              <div class="col-12 mt-5 mb-3 text-center">
                <button type="submit" class="btn btn-graphite px-3">Generate</button>
              </div>
            </form>
            <div id="passgen-result" class="mt-4"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Load the shared footer from footer.html using htmx (avoids code duplication across pages) -->
  <div hx-get="footer.html" hx-trigger="load"></div>

</body>

</html>
